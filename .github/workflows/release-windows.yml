name: Build Remix Windows release draft

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v2.2.1
        required: true

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - name: Verify tag and package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG does not match package version $version" }
          if (-not (git tag --list $env:RELEASE_TAG)) { throw "Tag $env:RELEASE_TAG does not exist" }
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Check source and runtime guards
        run: npm run check
      - name: Check Electron startup and recovery
        run: npm run test:electron
      - name: Build Windows installer and update metadata
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: '& .\node_modules\.bin\electron-builder.cmd --win nsis --publish never'
      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -match '^Mineradio-Remix-.*-Setup\.exe$|^latest\.yml$|\.blockmap$' }
          if (-not ($files | Where-Object { $_.Name -match '^Mineradio-Remix-.*-Setup\.exe$' })) { throw 'Installer missing' }
          if (-not ($files | Where-Object { $_.Name -eq 'latest.yml' })) { throw 'latest.yml missing' }
          $lines = $files | ForEach-Object { $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant(); "$hash  $($_.Name)" }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding utf8
      - name: Create draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Mineradio-Remix-*-Setup.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
